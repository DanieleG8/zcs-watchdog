name: Watchdog impianto (fotovoltaico + batteria)

on:
  schedule:
    # Lo scheduler di GitHub e' inaffidabile: dichiarare "*/15" NON significa
    # girare ogni 15 minuti (in pratica ne parte una ogni 2-6 ore). Per questo
    # ogni esecuzione, una volta partita, resta viva e ricontrolla in loop
    # (vedi LOOP_MINUTES / LOOP_INTERVAL_SEC nello step "Run watchdog").
    # Il cron fitto serve solo a farsi "svegliare" il prima possibile.
    - cron: "*/15 * * * *"
  # Trigger esterno opzionale (es. cron-job.org -> API GitHub) se un giorno
  # si vuole una cadenza garantita:
  #   POST /repos/OWNER/REPO/dispatches  {"event_type":"zcs-check"}
  repository_dispatch:
    types: [zcs-check]
  workflow_dispatch:
    inputs:
      mode:
        description: "Modalita' di esecuzione"
        type: choice
        default: run
        options:
          - run    # esecuzione normale (in loop)
          - once   # un solo controllo, poi esce (utile per prove veloci)
          - dump   # stampa potenza e lastUpdate grezzi (calibrazione)
          - test   # invia una notifica di prova

# Serve per ricommittare state.json
permissions:
  contents: write

# Una sola esecuzione per volta. Le altre restano in coda e partono appena
# questa finisce: cosi' la copertura resta continua invece di avere buchi.
concurrency:
  group: zcs-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    # Rete di sicurezza: deve essere > LOOP_MINUTES + qualche minuto di setup.
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          # sodium serve a tesla.php per risalvare il refresh token nei Secrets
          extensions: curl, json, sodium
          coverage: none

      - name: Controlla impianto e batteria
        id: wd
        env:
          # --- Secrets ZCS (Settings > Secrets and variables > Actions) ---
          ZCS_CLIENT_CODE: ${{ secrets.ZCS_CLIENT_CODE }}
          ZCS_AUTH_KEY:    ${{ secrets.ZCS_AUTH_KEY }}
          ZCS_THING_KEY:   ${{ secrets.ZCS_THING_KEY }}
          # --- Canali extra opzionali (email a parte, vedi step sotto) ---
          TG_BOT_TOKEN:    ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:      ${{ secrets.TG_CHAT_ID }}
          WEBHOOK_URL:     ${{ secrets.WEBHOOK_URL }}
          # --- Variables (o lascia i default nello script) ---
          PLANT_LAT:         ${{ vars.PLANT_LAT }}
          PLANT_LON:         ${{ vars.PLANT_LON }}
          ZERO_W_THRESHOLD:  ${{ vars.ZERO_W_THRESHOLD }}
          ZERO_PERSIST_MIN:  ${{ vars.ZERO_PERSIST_MIN }}
          STALE_LIMIT_MIN:   ${{ vars.STALE_LIMIT_MIN }}
          ENERGY_WINDOW_MIN: ${{ vars.ENERGY_WINDOW_MIN }}
          RENOTIFY_HOURS:    ${{ vars.RENOTIFY_HOURS }}
          GUIDE_URL:         ${{ vars.GUIDE_URL }}
          LASTUPDATE_IS_UTC: ${{ vars.LASTUPDATE_IS_UTC }}
          # --- Batteria Tesla: gira nello stesso job, cosi' un solo risveglio
          #     copre tutti e due gli impianti e ogni mail li puo' citare entrambi.
          TESLA_CLIENT_ID:     ${{ vars.TESLA_CLIENT_ID || secrets.TESLA_CLIENT_ID }}
          TESLA_REDIRECT_URI:  ${{ vars.TESLA_REDIRECT_URI || secrets.TESLA_REDIRECT_URI }}
          TESLA_CLIENT_SECRET: ${{ secrets.TESLA_CLIENT_SECRET }}
          TESLA_REFRESH_TOKEN: ${{ secrets.TESLA_REFRESH_TOKEN }}
          TESLA_SITE_ID:       ${{ vars.TESLA_SITE_ID || secrets.TESLA_SITE_ID }}
          GH_SECRETS_TOKEN:    ${{ secrets.GH_SECRETS_TOKEN }}
          TESLA_REGION:              ${{ vars.TESLA_REGION }}
          TESLA_STALE_LIMIT_MIN:     ${{ vars.TESLA_STALE_LIMIT_MIN }}
          TESLA_OFFGRID_PERSIST_MIN: ${{ vars.TESLA_OFFGRID_PERSIST_MIN }}
          TESLA_UNREACH_PERSIST_MIN: ${{ vars.TESLA_UNREACH_PERSIST_MIN }}
          TESLA_SOC_MIN_PERCENT:     ${{ vars.TESLA_SOC_MIN_PERCENT }}
          TZ: Europe/Rome
          # --- Loop interno (rimedio ai cron saltati da GitHub) ---
          WD_MODE:           ${{ inputs.mode || 'run' }}
          LOOP_MINUTES:      ${{ vars.LOOP_MINUTES || '55' }}
          LOOP_INTERVAL_SEC: ${{ vars.LOOP_INTERVAL_SEC || '300' }}
        shell: bash
        run: |
          set +e -uo pipefail

          # I due impianti si controllano nello stesso giro, ma restano
          # indipendenti: ognuno ha il suo stato, le sue soglie e le sue mail.
          # Se uno dei due script muore, l'altro viene eseguito lo stesso.
          controlla() {
            php watchdog.php
            rc=$?
            [ "$rc" -ne 0 ] && echo "ATTENZIONE: watchdog.php uscito con codice $rc"
            php tesla.php
            rc=$?
            [ "$rc" -ne 0 ] && echo "ATTENZIONE: tesla.php uscito con codice $rc"
            return 0
          }

          case "$WD_MODE" in
            dump) php watchdog.php --dump; exit $? ;;
            test) php watchdog.php --test; exit $? ;;
            once) controlla;               exit 0  ;;
          esac

          deadline=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          n=0
          while :; do
            n=$(( n + 1 ))
            echo "--- controllo #$n ($(date -u +%H:%M:%S) UTC) ---"
            controlla

            # Se uno dei due ha deciso di notificare, esco subito: le mail
            # partono negli step successivi (ritardo max ~LOOP_INTERVAL_SEC).
            if grep -qxE '(tesla_)?notify=1' "$GITHUB_OUTPUT" 2>/dev/null; then
              echo "Notifica richiesta: esco dal loop per inviarla."
              break
            fi

            if [ $(( deadline - $(date +%s) )) -lt "$LOOP_INTERVAL_SEC" ]; then
              echo "Finestra esaurita: chiudo (ripartira' il prossimo run schedulato)."
              break
            fi
            sleep "$LOOP_INTERVAL_SEC"
          done
          echo "Loop terminato dopo $n controlli."

      - name: Send email (fotovoltaico)
        # Parte solo quando lo script ha deciso di notificare (allarme / rientro / test)
        if: steps.wd.outputs.notify == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          secure:         true                       # true per porta 465 (SSL)
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        ${{ steps.wd.outputs.subject }}
          to:             ${{ secrets.MAIL_TO }}
          from:           ZCS Watchdog <${{ secrets.MAIL_FROM }}>
          body:           ${{ steps.wd.outputs.body }}

      - name: Send email (batteria)
        # Notifica separata: se scattano insieme partono due mail distinte.
        if: steps.wd.outputs.tesla_notify == '1'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port:    ${{ secrets.MAIL_PORT }}
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        ${{ steps.wd.outputs.tesla_subject }}
          to:             ${{ secrets.MAIL_TO }}
          from:           ZCS Watchdog <${{ secrets.MAIL_FROM }}>
          body:           ${{ steps.wd.outputs.tesla_body }}

      - name: Persist state
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          CAMBIATI=$(git diff --name-only -- state.json state-tesla.json)
          if [ -z "$CAMBIATI" ]; then
            echo "Stati invariati, nessun commit."
            exit 0
          fi
          git config user.name  "zcs-watchdog[bot]"
          git config user.email "actions@users.noreply.github.com"

          # I file di stato sono GENERATI, non scritti a mano: in caso di
          # collisione l'ultima misura e' quella buona, non c'e' niente da
          # fondere. Il 15/09 un 'git pull --rebase' su state-tesla.json ha
          # trovato un conflitto, lasciato il repo in HEAD staccato con file
          # non risolti, e i tre tentativi sono falliti uno dietro l'altro
          # ("Pulling is not possible because you have unmerged files"): lo
          # stato di quel giro e' andato perso e il run e' finito rosso.
          # Quindi: niente rebase. Si riparte dal remoto e si riscrive.
          SALVA=$(mktemp -d)
          for f in $CAMBIATI; do cp "$f" "$SALVA/$(basename "$f")"; done

          for i in 1 2 3; do
            git add $CAMBIATI
            git commit -m "state: aggiornamento $(date -u +%FT%TZ)" || true
            git push && exit 0
            echo "Push fallito (tentativo $i): riparto dal remoto e riscrivo."
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}" || true
            git reset --hard "origin/${GITHUB_REF_NAME}" || true
            # Solo i file che questo giro ha davvero toccato: se l'altro lato
            # ne ha aggiornato uno che noi non abbiamo scritto, resta il suo.
            for f in $CAMBIATI; do cp "$SALVA/$(basename "$f")" "$f"; done
            sleep $(( i * 5 ))
          done
          echo "Push dello stato non riuscito." >&2
          exit 1
